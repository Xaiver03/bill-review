<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>账单复核</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--fg:#e6e9ef;--dim:#8b93a7;--accent:#4f8cff;--ok:#37c98b;--warn:#f5a524;}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10}
  header h1{font-size:15px;margin:0;font-weight:600}
  .stat{color:var(--dim);font-size:13px}.stat b{color:var(--fg)}
  .grow{flex:1}
  button,select,input{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
  button{cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button:disabled{opacity:.4;cursor:default}
  .bar{display:flex;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .bar .sep{width:1px;height:20px;background:var(--line)}
  main{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 104px)}
  .merch{border-right:1px solid var(--line);overflow:auto;padding:8px}
  .merch .m{display:flex;flex-direction:column;gap:4px;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
  .merch .m .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .merch .m .nm{font-weight:600;font-size:13px;word-break:break-all}
  .merch .m .ct{color:var(--dim);font-size:12px;white-space:nowrap}
  .merch select{width:100%;padding:4px 6px;font-size:12px}
  .tablewrap{overflow:auto}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{position:sticky;top:0;background:var(--panel);z-index:2;color:var(--dim);font-weight:500}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.changed{background:rgba(55,201,139,.10)}
  tr.done{opacity:.5}
  tr.sel{background:rgba(79,140,255,.12)}
  td select,td input[data-l2]{padding:3px 6px;font-size:12px;width:110px}
  .conf{font-size:11px;padding:1px 6px;border-radius:999px;background:#22283a;color:var(--dim)}
  .conf.low{background:rgba(245,165,36,.18);color:var(--warn)}
  .conf.ai{background:rgba(79,140,255,.18);color:#9db8ff}
  .hint{color:var(--dim);font-size:12px;padding:24px}
  .mini{color:var(--dim);font-size:12px}
  #selinfo{color:var(--accent);font-size:13px;min-width:64px}
</style>
</head>
<body>
<header>
  <h1>账单复核</h1>
  <label class="mini">账单文件 <input type="file" id="file" accept=".csv" style="border:0;padding:0"></label>
  <span class="stat" id="stat">未加载</span>
  <div class="grow"></div>
  <button class="primary" id="export" disabled>导出已复核 CSV</button>
</header>
<div class="bar">
  <label class="mini">来源 <select id="fsrc"><option value="">全部</option></select></label>
  <label class="mini">搜索对手方 <input id="fsearch" placeholder="关键词" style="width:140px"></label>
  <label class="mini"><input type="checkbox" id="fonly" checked> 只看待复核</label>
  <label class="mini">排序 <select id="fsort"><option value="date_desc">时间↓</option><option value="amount_desc">金额↓</option><option value="amount_asc">金额↑</option></select></label>
  <span class="sep"></span>
  <span id="selinfo">已选 0</span>
  <select id="bulkcat"></select>
  <button id="bulkapply" disabled>应用到选中</button>
  <div class="grow"></div>
  <span class="mini" id="progress"></span>
</div>
<main>
  <section class="merch" id="merch"><div class="hint">加载 classified.csv 后，这里按对手方列出，选分类即整户套用。</div></section>
  <section class="tablewrap"><table>
    <thead><tr><th style="width:26px"><input type="checkbox" id="selAll"></th><th>时间</th><th>来源</th><th>对手方</th><th>备注</th><th style="text-align:right">金额</th><th>分类</th><th>子分类</th><th>置信</th></tr></thead>
    <tbody id="tbody"><tr><td colspan="9" class="hint">尚未加载文件</td></tr></tbody>
  </table></section>
</main>
<script>
const TAX = ['餐饮','交通出行','购物日用','居住','生活服务','娱乐休闲','医疗健康','教育学习','旅游住宿','人情往来','金融保险','投资理财','转账还款','收入','退款/冲正','其他'];
let COLS=[], RAW=[], CORR={}, SEL=new Set();
const $=s=>document.querySelector(s);
const key=r=>r.transaction_id||`${r.source}|${r.datetime}|${r.amount}|${r.counterparty}|${r.note}`;

function parseCSV(text){
  const rows=[]; let f='', row=[], q=false;
  text=text.replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false;} else f+=c; }
    else { if(c==='"') q=true; else if(c===','){row.push(f);f='';} else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';} else if(c==='\r'){} else f+=c; }
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}
function load(text){
  const rows=parseCSV(text); if(!rows.length) return;
  COLS=rows[0]; RAW=rows.slice(1).map(r=>{const o={};COLS.forEach((k,i)=>o[k]=r[i]??'');return o;});
  CORR={}; SEL=new Set();
  const cached=localStorage.getItem('billkit_corr'); if(cached) CORR=JSON.parse(cached);
  const srcs=[...new Set(RAW.map(r=>r.source))].filter(Boolean);
  $('#fsrc').innerHTML='<option value="">全部</option>'+srcs.map(s=>`<option>${s}</option>`).join('');
  $('#bulkcat').innerHTML=TAX.map(t=>`<option>${t}</option>`).join('');
  $('#export').disabled=false;
  render();
}
function filtered(){
  const src=$('#fsrc').value, q=$('#fsearch').value.trim(), only=$('#fonly').checked, sort=$('#fsort').value;
  let xs=RAW.filter(r=>{
    if(only && r.needs_review!=='1') return false;
    if(src && r.source!==src) return false;
    if(q && !((r.counterparty||'')+(r.note||'')).includes(q)) return false;
    return true;
  });
  xs.sort((a,b)=> sort==='amount_desc'? (+b.amount)-(+a.amount) : sort==='amount_asc'? (+a.amount)-(+b.amount) : (b.datetime>a.datetime?1:-1));
  return xs;
}
function eff(r){ const c=CORR[key(r)]; return {l1:c?c.l1:(r.purpose_l1||'其他'), l2:c?c.l2:(r.purpose_l2||''), done:!!c}; }
function render(){
  const xs=filtered();
  const rev=RAW.filter(r=>r.needs_review==='1');
  const left=rev.filter(r=>!CORR[key(r)]).length;
  $('#stat').innerHTML=`总计 <b>${RAW.length}</b> · 待复核 <b>${rev.length}</b> · 剩余 <b>${left}</b>`;
  $('#progress').textContent = rev.length? `复核进度 ${((rev.length-left)/rev.length*100).toFixed(0)}%`:'';
  // 商户面板
  const g={};
  xs.forEach(r=>{const n=r.counterparty||'（空）';(g[n]=g[n]||[]).push(r);});
  const arr=Object.entries(g).sort((a,b)=>b[1].length-a[1].length);
  $('#merch').innerHTML = arr.map(([n,rs])=>{
    const cur=eff(rs[0]);
    const opts=TAX.map(t=>`<option ${t===cur.l1?'selected':''}>${t}</option>`).join('');
    return `<div class="m"><div class="top"><span class="nm">${esc(n)}</span><span class="ct">${rs.length} 条</span></div>`+
           `<select data-merch="${escA(n)}">${opts}</select></div>`;
  }).join('') || '<div class="hint">当前条件下无待复核商户</div>';
  // 表格
  $('#tbody').innerHTML = xs.slice(0,800).map((r)=>{
    const e=eff(r); const low=(+r.confidence||0)<0.6; const ai=(r.classify_by==='ai');
    const k=key(r);
    return `<tr data-k="${escA(k)}" class="${e.done?'changed':''} ${r.needs_review!=='1'?'done':''} ${SEL.has(k)?'sel':''}">`+
      `<td><input type="checkbox" data-sel="${escA(k)}" ${SEL.has(k)?'checked':''}></td>`+
      `<td>${(r.datetime||'').slice(0,16)}</td><td>${esc(r.source)}</td><td>${esc(r.counterparty)}</td>`+
      `<td title="${escA(r.note)}">${esc((r.note||'').slice(0,16))}</td>`+
      `<td class="num">${(+r.amount||0).toFixed(2)}</td>`+
      `<td><select data-l1>${TAX.map(t=>`<option ${t===e.l1?'selected':''}>${t}</option>`).join('')}</select></td>`+
      `<td><input data-l2 value="${escA(e.l2)}" placeholder="子分类"></td>`+
      `<td><span class="conf ${low?'low':''} ${ai?'ai':''}">${r.confidence||''}</span></td></tr>`;
  }).join('') || '<tr><td colspan="9" class="hint">无记录</td></tr>';
  if(xs.length>800) $('#tbody').insertAdjacentHTML('beforeend',`<tr><td colspan="9" class="hint">仅显示前 800 行（共 ${xs.length}）</td></tr>`);
  $('#selinfo').textContent=`已选 ${SEL.size}`;
  $('#bulkapply').disabled = SEL.size===0;
  persist();
}
function esc(s){return (s??'').toString().replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function escA(s){return (s??'').toString().replace(/"/g,'&quot;');}
function setRow(k,l1,l2){ CORR[k]={l1,l2:l2||''}; persist(); }
function persist(){ localStorage.setItem('billkit_corr',JSON.stringify(CORR)); }

document.addEventListener('change',e=>{
  // 商户整户套用
  const sel=e.target.closest('select[data-merch]');
  if(sel){ const name=sel.getAttribute('data-merch'); const l1=sel.value;
    RAW.forEach(r=>{ if((r.counterparty||'（空）')===name) setRow(key(r),l1,''); }); render(); return; }
  // 勾选
  if(e.target.matches('[data-sel]')){ const k=e.target.getAttribute('data-sel'); if(e.target.checked) SEL.add(k); else SEL.delete(k); $('#selinfo').textContent=`已选 ${SEL.size}`; $('#bulkapply').disabled=SEL.size===0; e.target.closest('tr').classList.toggle('sel',e.target.checked); return; }
  // 行内改分类
  const tr=e.target.closest('tr[data-k]');
  if(tr){ const k=tr.getAttribute('data-k'); const l1=tr.querySelector('[data-l1]').value; const l2=tr.querySelector('[data-l2]').value; setRow(k,l1,l2); render(); }
});
document.addEventListener('input',e=>{
  const inp=e.target.closest('input[data-l2]'); if(!inp) return;
  const tr=inp.closest('tr[data-k]'); const k=tr.getAttribute('data-k'); const l1=tr.querySelector('[data-l1]').value; setRow(k,l1,inp.value);
});
$('#selAll').addEventListener('change',e=>{
  const xs=filtered().slice(0,800);
  if(e.target.checked) xs.forEach(r=>SEL.add(key(r))); else SEL.clear();
  render();
});
$('#bulkapply').addEventListener('click',()=>{
  const l1=$('#bulkcat').value;
  SEL.forEach(k=>{ CORR[k]={l1,l2:''}; });
  SEL.clear(); render();
});
['#fsrc','#fsearch','#fonly','#fsort'].forEach(s=>$(s).addEventListener('input',render));
$('#file').addEventListener('change',ev=>{const f=ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>load(rd.result);rd.readAsText(f,'utf-8');});
$('#export').addEventListener('click',()=>{
  const out=[COLS.join(',')];
  RAW.forEach(r=>{ const c=CORR[key(r)]; const o={...r}; if(c){o.purpose_l1=c.l1;o.purpose_l2=c.l2;o.needs_review='0';} out.push(COLS.map(k=>cell(o[k])).join(',')); });
  download('classified_corrected.csv', out.join('\r\n'));
});
function cell(v){v=(v??'').toString();return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function download(name,text){const b=new Blob([text],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();}
</script>
</body>
</html>
